[project]
name = "sih26-26153"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pandas>=2.2,<4",
    "PyYAML>=6.0,<7",
    "scapy>=2.5,<3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[project.scripts]
sentinel-agent = "src.agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
