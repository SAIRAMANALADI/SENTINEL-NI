[project]
name = "sih26-26153"
version = "0.1.0"
description = "Out-of-band predictive network-security monitoring and forecasting"
requires-python = ">=3.12,<3.15"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sentinel / NI contributors" }]
keywords = ["network-security", "forecasting", "telemetry", "sensors"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pandas>=2.2,<4",
    "PyYAML>=6.0,<7",
    "scapy>=2.5,<3",
]

[project.urls]
Repository = "https://github.com/SAIRAMANALADI/SENTINEL-NI"
Issues = "https://github.com/SAIRAMANALADI/SENTINEL-NI/issues"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[project.scripts]
sentinel-agent = "src.agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
