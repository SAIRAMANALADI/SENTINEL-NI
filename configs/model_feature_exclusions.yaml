  - field: Protocol
    reason: Flow-key component and possible attack proxy; excluded until leakage policy is approved.
    risk_level: medium
  - field: Flow Byts/s
    reason: Contains 6169 non-finite values caused by zero-duration flows; no blind imputation is authorized.
